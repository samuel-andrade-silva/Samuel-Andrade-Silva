<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img" aria-label="AI English Coach, a personal project. Before: the same English errors kept repeating because nothing captured, remembered or drilled them. After: a Telegram coach that stores each error, corrects it and sends it to Anki." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <clipPath id="c"><rect width="900" height="276" rx="16"/></clipPath>
</defs>
<rect width="900" height="276" rx="16" fill="#161B22" stroke="#30363D"/>
<g clip-path="url(#c)"><rect x="520" width="380" height="276" fill="#1B2233"/></g>
<text x="36" y="40" font-size="11" letter-spacing="2" fill="#A78BFA">PERSONAL PROJECT</text>
<text x="36" y="72" font-size="26" font-weight="700" fill="#E6EDF3">AI English Coach</text>
<text x="36" y="116" font-size="12" letter-spacing="2" fill="#8B949E">BEFORE</text>
<!-- EDIT: before text -->
<text x="36" y="142" font-size="15" fill="#B1BAC4" >The same English errors kept repeating,</text>
<text x="36" y="164" font-size="15" fill="#B1BAC4" >because nothing captured, remembered</text>
<text x="36" y="186" font-size="15" fill="#B1BAC4" >or drilled them.</text>
<circle cx="520" cy="138" r="21" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
<path d="M512 138 H528 M522 131 L529 138 L522 145" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="564" y="116" font-size="12" letter-spacing="2" fill="#A78BFA">AFTER</text>
<!-- EDIT: big text or number -->
<text x="564" y="158" font-size="36" fill="url(#g)" font-weight="700">Every error</text>
<text x="564" y="196" font-size="36" fill="url(#g)" font-weight="700">remembered</text>
<text x="564" y="224" font-size="14" fill="#8B949E" >A Telegram coach that stores each error,</text>
<text x="564" y="244" font-size="14" fill="#8B949E" >corrects it and sends it to Anki.</text>
<g transform="translate(832,24)"><rect width="44" height="44" rx="11" fill="url(#g)"/><g transform="translate(10,10)" fill="none" stroke="#0D1117" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5 H19 V15 H11 L7 19 V15 H5 Z"/></g></g>
</svg>
